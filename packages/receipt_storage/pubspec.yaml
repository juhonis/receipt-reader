name: receipt_storage
description: Transactional local receipt storage with an immutable change log.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0

dependencies:
  crypto: 3.0.7
  drift: 2.35.4
  receipt_domain:
    path: ../receipt_domain
  sqlite3: 3.9.1

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.3
  receipt_parser:
    path: ../receipt_parser
  test: 1.33.0
