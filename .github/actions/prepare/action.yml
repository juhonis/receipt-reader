name: Prepare reviewed Windows toolchain
description: Install the pinned Flutter revision and validate native dependency notices
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Prepare reviewed Flutter, Android and Windows OCR inputs
      shell: pwsh
      run: python tools/ci/prepare.py
