import groovy.json.JsonOutput
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('receiptLicenseInventory') {
        doLast {
            def artifacts = app.configurations.releaseRuntimeClasspath.incoming.artifactView {
                componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.artifacts.artifacts
            def components = artifacts.collect { it.id.componentIdentifier }.unique()
            def poms = [:]
            app.dependencies.createArtifactResolutionQuery()
                .forComponents(components)
                .withArtifacts(MavenModule, MavenPomArtifact)
                .execute().resolvedComponents.each { component ->
                    component.getArtifacts(MavenPomArtifact).each { pom ->
                        if (pom instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult) {
                            poms[component.id.displayName] = pom.file.absolutePath
                        }
                    }
                }
            def rows = artifacts.collect { artifact ->
                [component: artifact.id.componentIdentifier.displayName,
                 file: artifact.file.absolutePath,
                 pom: poms[artifact.id.componentIdentifier.displayName]]
            }.sort { it.component }
            def target = new File(gradle.rootProject.projectDir, '../build/licenses/android-artifacts.json')
            target.parentFile.mkdirs()
            def inputs = [:]
            ['pubspec.yaml', 'pubspec.lock', 'android/app/build.gradle.kts', 'android/app/proguard-rules.pro',
             'android/settings.gradle.kts', 'android/build.gradle.kts',
             'android/gradle.properties', 'tools/licenses/android-inventory.init.gradle'].each { name ->
                def source = new File(gradle.rootProject.projectDir, '../' + name)
                inputs[name] = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(source.bytes).encodeHex().toString()
            }
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(
                [schemaVersion: 1, configuration: 'releaseRuntimeClasspath',
                 ndkVersion: app.android.ndkVersion, inputs: inputs, artifacts: rows])) + '\n'
            println 'Wrote Android release artifact inventory'
        }
    }
}
