name: receipt_reader
description: Offline receipt tracking for Android and Windows.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  receipt_parser:
    path: packages/receipt_parser
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_ui: ^1.1.6
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
