name: receipt_reader
description: Offline receipt tracking for Android and Windows.
publish_to: none
version: 0.2.0-alpha.3+4

environment:
  sdk: ^3.14.0

dependencies:
  crypto: 3.0.7
  receipt_domain:
    path: packages/receipt_domain
  receipt_parser:
    path: packages/receipt_parser
  receipt_storage:
    path: packages/receipt_storage
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_ui: ^1.1.6
  material_ui: ^1.1.0
  file_selector: 1.1.0
  path_provider: 2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  licenses:
    - LICENSE
    - third_party/NOTICES.txt
